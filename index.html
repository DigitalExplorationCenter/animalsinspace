<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>270° Immersive Studio — 12312 × 1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --surface: #10101a;
    --panel-bg: rgba(12, 12, 22, 0.92);
    --accent: #c8a96e;
    --accent2: #7b9cff;
    --text: #e8e4dc;
    --muted: #6b6878;
    --border: rgba(200, 169, 110, 0.18);
    --glow: rgba(123, 156, 255, 0.12);

    /* Studio canvas — 12312 × 1080 px, 270° wrap */
    --canvas-w: 12312px;
    --canvas-h: 1080px;
    --viewport-h: 100vh;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  /* ── CHROME ──────────────────────────────────────────── */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 36px;
    background: linear-gradient(180deg, rgba(8,8,16,.96) 60%, transparent);
    pointer-events: none;
  }
  #hud .studio-label {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  #hud .studio-dims {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  #hud .studio-angle {
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--accent2);
  }

  /* ── MINIMAP ─────────────────────────────────────────── */
  #minimap-wrap {
    position: fixed;
    bottom: 28px; right: 36px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  #minimap-label {
    font-size: 9px;
    letter-spacing: .18em;
    color: var(--muted);
    text-transform: uppercase;
  }
  #minimap {
    width: 200px;
    height: 22px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  #minimap-thumb {
    position: absolute;
    top: 2px; bottom: 2px;
    background: rgba(200,169,110,.35);
    border: 1px solid var(--accent);
    border-radius: 2px;
    transition: left .08s, width .08s;
  }
  #minimap-dots {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 4px;
    gap: 0;
    pointer-events: none;
  }
  .mm-dot {
    flex: 1;
    height: 6px;
    margin: 0 1px;
    background: rgba(255,255,255,.07);
    border-radius: 1px;
  }

  /* ── CONTROLS ────────────────────────────────────────── */
  #controls {
    position: fixed;
    bottom: 28px; left: 36px;
    z-index: 100;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .ctrl-btn {
    width: 40px; height: 40px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .ctrl-btn:hover { background: rgba(200,169,110,.14); border-color: var(--accent); }


  /* ── STUDIO VIEWPORT ─────────────────────────────────── */
  #studio-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  #studio-viewport.dragging { cursor: grabbing; }

  /* ── STUDIO CANVAS (13578 × 1200) ───────────────────── */
  #studio-canvas {
    width: var(--canvas-w);
    height: var(--canvas-h);
    position: absolute;
    top: 50%;
    transform: translateY(-50%) translateX(0);
    will-change: transform;
  }

  /* Floor & ceiling gradient strips */
  #studio-canvas::before,
  #studio-canvas::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 0;
  }
  #studio-canvas::before {
    top: 0; height: 90px;
    background: linear-gradient(180deg, rgba(8,8,16,.9) 0%, transparent 100%);
  }
  #studio-canvas::after {
    bottom: 0; height: 90px;
    background: linear-gradient(0deg, rgba(8,8,16,.9) 0%, transparent 100%);
  }

  /* Studio background — subtle grid + gradient sky */
  #studio-bg {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        #0b0b18 0%,
        #0d0d1e 45%,
        #0a0a16 100%);
    z-index: 0;
  }
  #studio-bg::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(123,156,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,156,255,.04) 1px, transparent 1px);
    background-size: 120px 120px;
    mask-image: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.5) 30%, rgba(0,0,0,.5) 70%, transparent 100%);
  }

  /* ── FLOOR LINE ──────────────────────────────────────── */
  #floor-line {
    position: absolute;
    bottom: 80px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 10%, var(--accent) 90%, transparent 100%);
    opacity: .25;
    z-index: 1;
  }

  /* ── AMBIENT GLOW POOLS ──────────────────────────────── */
  .glow-pool {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }

  /* ── SECTION DIVIDERS ────────────────────────────────── */
  .section-divider {
    position: absolute;
    top: 60px; bottom: 60px;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--border) 30%, var(--border) 70%, transparent);
    z-index: 2;
  }

  /* ── EXHIBIT PANELS ──────────────────────────────────── */
  .panel {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .2s;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  .panel:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 12px 60px rgba(200,169,110,.12);
    transform: translateY(-4px);
    z-index: 20;
  }
  .panel-img {
    width: 100%;
    flex: 1;
    object-fit: cover;
    display: block;
    background: #1a1a2e;
  }
  /* Placeholder gradient images */
  .panel-img-placeholder {
    width: 100%;
    flex: 1;
    display: block;
    min-height: 200px;
  }
  .panel-meta {
    padding: 14px 16px 16px;
    border-top: 1px solid var(--border);
  }
  .panel-tag {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .panel-sub {
    font-size: 11px;
    color: var(--text);
    line-height: 1.5;
  }

  /* ── HERO BANNER ─────────────────────────────────────── */
  #hero-banner {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
    white-space: nowrap;
  }
  #hero-banner h1 {
    font-size: clamp(28px, 3.5vw, 52px);
    font-weight: 200;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--text);
    opacity: .85;
  }
  #hero-banner p {
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* ── TEXT-ONLY PANEL ─────────────────────────────────── */
  .panel-text {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 36px 32px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    transition: border-color .2s, box-shadow .2s;
    width: auto !important;
    height: auto !important;
    max-width: 600px;
    min-width: 280px;
  }
  .panel-text:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 12px 60px rgba(200,169,110,.12);
  }
  .panel-text .panel-tag   { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .panel-text .panel-title { font-size:22px; font-weight:600; color:var(--text); line-height:1.25; margin-bottom:18px; }
  .panel-text .panel-sub   { font-size:13px; color:var(--text); line-height:1.75; }
  .panel-text .text-rule   { width:40px; height:1px; background:var(--accent); opacity:.4; margin: 20px 0; }

  /* ── 2×2 QUAD IMAGE GRID ─────────────────────────────── */
  .quad-grid {
    position: absolute;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(2, var(--cell-size, 220px));
    grid-template-rows: repeat(2, auto);
    gap: 12px;
    visibility: hidden;
  }
  .quad-cell {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color .2s, transform .2s, box-shadow .2s;
    background: var(--panel-bg);
    overflow: hidden;
  }
  .quad-cell:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 30px rgba(200,169,110,.15);
    z-index: 20;
  }
  .quad-cell-img {
    width: 100%;
    height: var(--cell-size, 220px);
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }
  .quad-cell canvas.quad-cell-img {
    width: 100% !important;
    height: var(--cell-size, 220px) !important;
  }
  .quad-cell-meta {
    padding: 10px 12px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .quad-cell-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .quad-cell-desc {
    font-size: 11px;
    color: var(--text);
    line-height: 1.5;
    opacity: .8;
  }

  /* ── ARCHIVE TITLE PANEL ─────────────────────────────── */
  .panel-archive-title {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 36px 32px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    width: auto !important;
    height: auto !important;
    max-width: 600px;
    min-width: 280px;
    transition: border-color .2s, box-shadow .2s;
  }
  .panel-archive-title:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 12px 60px rgba(200,169,110,.12);
  }
  .panel-archive-title .panel-tag   { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .panel-archive-title .panel-title { font-size:22px; font-weight:600; color:var(--text); line-height:1.25; margin-bottom:18px; }
  .panel-archive-title .panel-sub   { font-size:13px; color:var(--text); line-height:1.75; }
  .panel-archive-title .text-rule   { width:40px; height:1px; background:var(--accent); opacity:.4; margin: 20px 0; }

  /* ── ARCHIVE GRID SECTION ────────────────────────────── */
  .archive-grid {
    position: absolute;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(4, 280px);
    grid-template-rows: repeat(2, auto);
    gap: 16px;
    visibility: hidden;
  }
  .archive-cell {
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .archive-cell:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 12px 60px rgba(200,169,110,.12);
    transform: translateY(-4px);
    z-index: 20;
  }
  .archive-cell-img { width:100%; aspect-ratio:3/2; height:auto; display:block; flex-shrink:0; object-fit:cover; }
  .archive-cell-meta { padding: 14px 16px 16px; border-top: 1px solid var(--border); }
  .archive-cell-tag   { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .archive-cell-title { font-size:14px; font-weight:600; color:var(--text); line-height:1.3; margin-bottom:4px; }
  .archive-cell-desc  { font-size:11px; color:var(--text); line-height:1.5; }

  /* ── OPENING GALLERY TITLE ───────────────────────────── */
  #opening-title {
    position: absolute;
    z-index: 10;
    text-align: center;
    white-space: nowrap;
    transform: translateX(-50%);
    top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  #opening-title .title-line1 {
    font-family: 'Orbitron', 'Courier New', monospace;
    font-size: 62px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #e8e4dc 0%, #c8a96e 45%, #7b9cff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    filter: drop-shadow(0 0 32px rgba(123,156,255,0.35));
  }
  #opening-title .title-line2 {
    font-family: 'Orbitron', 'Courier New', monospace;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 14px;
    opacity: .9;
    filter: drop-shadow(0 0 18px rgba(200,169,110,0.4));
  }
  #opening-title .title-text-area {
    margin-top: 32px;
    max-width: 900px;
    white-space: normal;
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 18px;
    line-height: 1.75;
    color: var(--text);
    opacity: .85;
    pointer-events: none;
  }

  /* ── SECTION LABELS ──────────────────────────────────── */
  .section-label {
    position: absolute;
    top: 32px;
    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 3;
    transform: translateX(-50%);
  }

  /* ── LIGHTBOX ────────────────────────────────────────── */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(6,6,12,.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  #lightbox.open {
    opacity: 1;
    pointer-events: all;
  }
  #lightbox-inner {
    max-width: 900px;
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  #lightbox-img-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: #12121e;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lightbox-img-wrap canvas {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #lightbox-body {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  #lightbox-text .lb-tag {
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 8px;
  }
  #lightbox-text .lb-title {
    font-size: 22px; font-weight: 300; letter-spacing: .06em; color: var(--text); margin-bottom: 6px;
  }
  #lightbox-text .lb-desc {
    font-size: 13px; color: var(--muted); line-height: 1.65; max-width: 520px;
  }
  #lb-close {
    width: 44px; height: 44px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #lb-close:hover { background: rgba(200,169,110,.15); }


</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="studio-label">270° Immersive Studio</div>
  <div class="studio-dims">12312 × 1080 px</div>
  <div class="studio-angle" id="angle-readout">0°</div>
</div>

<!-- MINIMAP -->
<div id="minimap-wrap">
  <div id="minimap-label">Studio Overview</div>
  <div id="minimap">
    <div id="minimap-dots"></div>
    <div id="minimap-thumb"></div>
  </div>
</div>

<!-- CONTROLS -->
<div id="controls">
  <button class="ctrl-btn" id="btn-left" title="Scroll left">&#8592;</button>
  <button class="ctrl-btn" id="btn-right" title="Scroll right">&#8594;</button>
</div>

<!-- STUDIO VIEWPORT -->
<div id="studio-viewport">
  <div id="studio-canvas">
    <div id="studio-bg"></div>
    <div id="floor-line"></div>
    <!-- Ambient glows injected by JS -->
    <!-- Section dividers injected by JS -->
    <!-- Panels injected by JS -->
    <div id="hero-banner">
      <h1></h1>
      <p></p>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="lightbox-inner">
    <div id="lightbox-img-wrap">
      <canvas id="lb-canvas" width="900" height="506"></canvas>
    </div>
    <div id="lightbox-body">
      <div id="lightbox-text">
        <div class="lb-tag" id="lb-tag"></div>
        <div class="lb-title" id="lb-title"></div>
        <div class="lb-desc" id="lb-desc"></div>
      </div>
      <button id="lb-close">✕</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   CONFIGURATION
═══════════════════════════════════════════════════════ */
const CANVAS_W = 12312;
const CANVAS_H = 1080;
const DEGREES  = 270;

/* Placeholder exhibit data — replace image srcs with real URLs */
const EXHIBIT_DATA = [
  // SECTION 4 — Motion & Time
  { section:'Motion & Time', tag:'Sequence', title:'Frame 0001–2400', desc:'Long-exposure astronomy collapsed into a single plane — motion as material.', x:1680, y:200, hue:[220,250], textOnly:true },
  { section:'Motion & Time', tag:'Interval', title:'Between Seconds', desc:'High-speed capture of the moment physics turns counterintuitive.', x:2140, y:200, w:300, h:440, hue:[160,200], imgSrc:'' },

  // SECTION 2 — Material Studies
  { section:'Material Studies', tag:'Surface', title:'Oxidized Field', desc:'Corrosion as aesthetic — iron, copper and time conspiring to produce unrepeatable texture.', x:2560, y:200, w:360, h:440, hue:[25,45], imgSrc:'' },
  { section:'Material Studies', tag:'Surface', title:'Grain Memory', desc:'The wood holds the record of every season — a biography in cross-section.', x:2960, y:200, w:360, h:440, hue:[35,55], imgSrc:'' },
  { section:'Material Studies', tag:'Texture', title:'Micro Atlas', desc:'Magnified to the point of abstraction — the familiar made alien at 200×.', x:3360, y:200, w:360, h:440, hue:[190,230], imgSrc:'' },

  // SECTION 3 — Architectures
  { section:'Architectures', tag:'Space', title:'Void / Volume', desc:'The negative space within brutalist shells — silence as structural element.', x:3840, y:200, w:360, h:440, hue:[200,240], imgSrc:'' },
  { section:'Architectures', tag:'Space', title:'Repetition Engine', desc:'Seriality as monument — when the unit multiplied becomes something else entirely.', x:4240, y:200, w:360, h:440, hue:[250,290], imgSrc:'' },

  // SECTION 5 — Colour Field (Félicette)
  { section:'Colour Field', tag:'Spectrum', title:'Félicette, France', desc:'Félicette, originally named C341, was one of fourteen female cats selected by the French space agency CNES as candidates for spaceflight. In preparation for the mission, the cats underwent a two-month training regimen and had electrodes permanently embedded in their skulls. Chosen from among her fellow cats for her calm demeanor and "appropriate" weight, Félicette was launched into space at the Centre Interarmées D\'essais D\'engins Spéciaux site in Algeria atop a Véronique AGI 47 rocket on October 18, 1963 at 8:09 am. The sub-orbital flight lasted 13 minutes, reaching a height of 94 miles (152 kilometers). During that time, Félicette experienced five minutes of weightlessness and was subjected to electrical impulses to her electrodes to stimulate brain and muscle activity. After her safe return, the press gave her the name Félicette, after the cartoon character Felix the Cat.<br><br>While Félicette survived her voyage into space, the decision was made to euthanize her two months later for study. Reports indicate no useful data was obtained from the ensuing necropsy. A second attempted launch with a cat aboard was unsuccessful leading to the death of the unnamed feline, and France moved on to other animals for spaceflight testing. With no futher need for them, the remaining cats were euthanized.<br><br>Félicette\'s story remained relatively unknown compared to the Russian space dog Laika or the American space chimps, but in 2017 a crowdfunded effort was launched to create a memorial to her journey. Completed in 2018, the sculpture depicts Félicette atop a globe, looking up at the skies she once visited, commemorating the flight and sacrifice of Earth\'s first, and so far only, cat astronaut.', x:5120, y:200, hue:[330,360], textOnly:true },

  // SECTION 6 — Figures (Laika)
  { section:'Figures', tag:'Portrait', title:'Laika, Soviet Union', desc:'Laika was a dog found on the streets of Moscow, one of three strays picked up to potentially serve as the first animal to orbit the earth. Soviet space officials believed that stray dogs would be suitable test subjects for spaceflight as they were used to harsh conditions and extended periods of hunger. The decision was made to go with Laika for the mission aboard a Sputnik 2, a rapidly designed spacecraft built to satisfy the political desires of the Kremlin to achieve another space first. As space travel was a new frontier and spacecraft design was in its infancy, Sputnik 2 had no ability to return to Earth: Laika\'s flight was a one-way ticket. Before the launch, Soviet scientist Vladimir Yazdovsky brought Laika to play with his children. He later wrote, "I wanted to do something nice for her: She had so little time left to live."<br><br>On the morning of November 3, 1959, Laika lifted off from the Baikonur Cosmodrome, becoming the first animal to orbit the earth. Recorded data shows Laika was highly stressed but eating her specially prepared food. Her voyage was short-lived; Laika died five to seven hours after achieving orbit, most likely due to overheating from a failed module separation and inadequate temperature regulation systems, as Sputnik 2 was hastily constructed. Soviet agencies gave conflicting reports on Laika\'s death, with her ultimate fate not being widely known until after the collapse of the Soviet Union. On April 14, 1957, the Sputnik 2 rocket with Laika\'s remains aboard disintegrated during re-entry after orbiting the earth 2570 times.<br><br>As the first dog to orbit the earth, Laika has become imbedded in popular culture through songs, movies, books, and even stamps. In 2008 a new memorial was unveiled in Moscow, depicting Laika as bright and attentive atop a rocket that transforms into a grasping hand, symbolizing her role in humanities\' reach for the stars.', x:625   { section:'Landscape', tag:'Geography', title:'Ham, United States', desc:'Ham, originally named No.65, was a chimpanzee purchased by the United States Air Force as one of forty spaceflight candidates. The space chimp program represented the next step in animal spaceflight as due to their biological similarities, their ability to learn from stimulus and instruction, and a reaction speed that was comparable to human pilots, apes could teach researchers much about the human potential to survive and operate in space. Like Félicette, Ham was given a number designation instead of a name to minimize the negative press from any fatal incident, although he was unofficially known as Ham to his trainers and the NASA team.<br><br>Ham and his fellow candidates were trained to push levers upon seeing a flashing light on a control panel. If he carried out his task he received a banana pellet; if he did not, an electric shock was administered.<br><br>On January 31, 1961, Ham flew into space from Cape Canaveral on a Mercury-Redstone 2 launch vehicle. His suborbital flight lasted sixteen minutes and thirty-nine seconds, during which time he responded to the control panel lights as he was trained to do, showing his reaction time in space was almost the same as back on Earth. As part of Project Mercury, his mission also served to test vital safety and environmental components for Alan Shepard\'s mission three months later.<br><br>After his return, Ham was officially named after the Holloman Aerospace Medical (HAM) Center and the commander of Holloman Aeromedical Laboratory, Lieutenant Colonel Hamilton "Ham" Blackshear. In 1963 he was sent to the National Zoo in Washington D.C. and later moved to the North Carolina Zoo. Ham died on January 19, 1983 and a historical marker near the zoo commemorates his brief flight into space.', x:7384, y:200, hue:[180,220], textOnly:true },

/* ═══════════════════════════════════════════════════════
   PLACEHOLDER IMAGE GENERATOR
═══════════════════════════════════════════════════════ */
function makePlaceholderCanvas(w, h, hueRange, title) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  c.style.width = '100%'; c.style.height = '100%';
  const ctx = c.getContext('2d');
  const [h1, h2] = hueRange;

  // gradient background
  const g = ctx.createLinearGradient(0, 0, c.width, c.height);
  g.addColorStop(0, `hsl(${h1},40%,10%)`);
  g.addColorStop(.5, `hsl(${(h1+h2)/2},55%,16%)`);
  g.addColorStop(1, `hsl(${h2},45%,8%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, c.width, c.height);

  // noise overlay
  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * c.width, y = Math.random() * c.height;
    const a = Math.random() * .06;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(x, y, 1, 1);
  }

  // geometric accent
  ctx.save();
  ctx.globalAlpha = .12;
  ctx.strokeStyle = `hsl(${h1},70%,70%)`;
  ctx.lineWidth = 1;
  const cx = c.width/2, cy = c.height/2;
  for (let r = 30; r < Math.max(c.width,c.height); r += 60) {
    ctx.beginPath();
    ctx.arc(cx + (Math.random()-.5)*80, cy + (Math.random()-.5)*80, r, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();

  // subtle label
  ctx.save();
  ctx.globalAlpha = .18;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(w,h)*0.08}px Helvetica Neue, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title.toUpperCase(), cx, cy);
  ctx.restore();

  return c;
}

/* ═══════════════════════════════════════════════════════
   IMAGE HELPER — returns <img> if imgSrc set, else canvas
═══════════════════════════════════════════════════════ */
function makeImage(w, h, item, cls) {
  if (item.imgSrc) {
    const img = document.createElement('img');
    img.src = item.imgSrc;
    img.className = cls;
    img.style.cssText = `width:100%;height:${h}px;object-fit:cover;display:block;`;
    return img;
  }
  const c = makePlaceholderCanvas(w, h, item.hue || [200,240], item.title || '');
  c.className = cls;
  return c;
}

function makeImageFromCell(w, h, cell, cls) {
  if (cell.imgSrc) {
    const img = document.createElement('img');
    img.src = cell.imgSrc;
    img.className = cls;
    img.style.cssText = `width:100%;height:${h}px;object-fit:cover;display:block;`;
    return img;
  }
  const c = makePlaceholderCanvas(w, h, cell.hue || [200,240], cell.title || '');
  c.className = cls;
  return c;
}

/* ── ANCHOR POSITIONING ─────────────────────────────── */
// Resolve the rendered left edge + width of any panel (text or image)
function resolvedRight(title) {
  const entry = panelEls[title];
  if (!entry) return 0;
  const { el, item } = entry;
  const left = parseFloat(el.style.left) || 0;
  if (item.textOnly) return left + el.offsetWidth;
  if (entry.isQuad) return left + entry.totalSize;
  return left + (item.w || 0);
}

function repositionAnchored() {
  // Process in data order so each anchor is resolved before its dependents
  EXHIBIT_DATA.forEach(item => {
    if (!item.anchoredTo) return;
    const entry = panelEls[item.title];
    if (!entry) return;

    if (item.sameXAs) {
      const refEntry = panelEls[item.sameXAs];
      if (refEntry) {
        entry.el.style.left = refEntry.el.style.left;
        entry.el.style.visibility = 'visible';
      }
      return;
    }

    const newLeft = resolvedRight(item.anchoredTo) + (item.gap || 0);
    entry.el.style.left = newLeft + 'px';
    if (!entry.isQuad) entry.el.style.visibility = 'visible'; // quads shown in height pass below
    else entry.el.style.visibility = 'visible';
  });

  // ── Archive grid: position + constrain top row to title panel height ──
  if (archiveTitleEl && archiveGridEl) {
    const titleLeft   = parseFloat(archiveTitleEl.style.left) || 0;
    const titleW      = archiveTitleEl.offsetWidth;
    const titleH      = archiveTitleEl.offsetHeight;
    const titleTop    = parseFloat(archiveTitleEl.style.top) || 200;

    archiveGridEl.style.left = (titleLeft + titleW + 20) + 'px';
    archiveGridEl.style.top  = titleTop + 'px';
    archiveGridEl.style.visibility = 'visible';

    // Grid gap is 16px; two rows. Total available = titleH.
    // Row 1 cells: image + meta. Meta is ~78px fixed. Image fills the rest.
    // Row 2 gets remaining height after gap.
    const GAP      = 16;
    const META_H   = 78; // tag + title + desc padding ≈ 78px
    const imgH_row1 = 187; // fixed 3:2 ratio at 280px width
    // grid is 4 cols × 280px + 3 gaps × 16px = 1168px total width
    const imgH_row2 = imgH_row1; // keep symmetrical

    const cells = archiveGridEl.querySelectorAll('.archive-cell');
    cells.forEach((cell, i) => {
      const imgEl = cell.querySelector('.archive-cell-img');
      if (!imgEl) return;
      const h = i < 3 ? imgH_row1 : imgH_row2;
      imgEl.style.height = h + 'px';
    });
  }

  // ── Dynamically adjust panels beside dynamic text panels ──
  ['Residue', 'Presence / Absence', 'Watershed'].forEach(textTitle => {
    const textEntry = panelEls[textTitle];
    if (!textEntry) return;
    const textTop  = parseFloat(textEntry.el.style.top) || 200;
    const textH    = textEntry.el.offsetHeight;
    if (!textH) return;

    EXHIBIT_DATA.forEach(item => {
      if (!item.anchoredTo || item.anchoredTo !== textTitle || item.sameXAs) return;
      const entry = panelEls[item.title];
      if (!entry) return;

      if (entry.isQuad) {
        // Vertically centre the quad grid against the text panel using actual rendered height
        const quadH = entry.el.offsetHeight || (item.cellSize || 220) * 2 + 12;
        const centredTop = textTop + Math.max(0, (textH - quadH) / 2);
        entry.el.style.top = centredTop + 'px';
        entry.el.style.visibility = 'visible';
      } else {
        // Standard anchored panel — match text panel height
        entry.el.style.height = textH + 'px';
        const imgEl = entry.el.querySelector('.panel-img-placeholder, img.panel-img-placeholder');
        if (imgEl) imgEl.style.height = (textH - 80) + 'px';
      }
    });
  });
}

// Run once after layout, then watch all text panels for resize
requestAnimationFrame(() => {
  repositionAnchored();

  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => repositionAnchored());
    ['Residue', 'Presence / Absence', 'Watershed', 'Frame 0001–2400', 'Afterimage'].forEach(title => {
      const entry = panelEls[title];
      if (entry) ro.observe(entry.el);
    });
    if (archiveTitleEl) ro.observe(archiveTitleEl);
  }
});

/* ═══════════════════════════════════════════════════════
   PANNING / SCROLLING
═══════════════════════════════════════════════════════ */
const viewport = document.getElementById('studio-viewport');
let scrollX = 0;
const maxScroll = CANVAS_W - window.innerWidth;
const thumbEl = document.getElementById('minimap-thumb');
const angleEl = document.getElementById('angle-readout');

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function applyScroll() {
  scrollX = clamp(scrollX, 0, maxScroll);
  studioCanvas.style.transform = `translateY(-50%) translateX(${-scrollX}px)`;
  // minimap
  const ratio = scrollX / maxScroll;
  const thumbW = (window.innerWidth / CANVAS_W) * 200;
  thumbEl.style.width = thumbW + 'px';
  thumbEl.style.left = ratio * (200 - thumbW) + 'px';
  // angle
  const deg = Math.round((scrollX / maxScroll) * DEGREES);
  angleEl.textContent = deg + '°';
}
applyScroll();

// Mouse drag
let isDragging = false, dragStartX = 0, dragStartScroll = 0;
viewport.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartScroll = scrollX;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  scrollX = dragStartScroll - (e.clientX - dragStartX);
  applyScroll();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
});

// Touch
let touchStartX = 0, touchStartScroll = 0;
viewport.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartScroll = scrollX;
});
viewport.addEventListener('touchmove', e => {
  scrollX = touchStartScroll - (e.touches[0].clientX - touchStartX);
  applyScroll();
  e.preventDefault();
}, { passive: false });

// Wheel
viewport.addEventListener('wheel', e => {
  scrollX += e.deltaY + e.deltaX;
  applyScroll();
  e.preventDefault();
}, { passive: false });

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  scrollX -= 120;
  if (e.key === 'ArrowRight') scrollX += 120;
  if (e.key === 'Escape') closeLightbox();
  applyScroll();
});

// Buttons
document.getElementById('btn-left').addEventListener('click', () => { scrollX -= 400; applyScroll(); });
document.getElementById('btn-right').addEventListener('click', () => { scrollX += 400; applyScroll(); });

/* ═══════════════════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════════════════ */
const lightbox = document.getElementById('lightbox');
let activeSrc = null;

function openLightbox(item, srcCanvas) {
  document.getElementById('lb-tag').textContent = item.tag;
  document.getElementById('lb-title').textContent = item.title;
  document.getElementById('lb-desc').textContent = item.desc;
  const lbC = document.getElementById('lb-canvas');
  const ctx = lbC.getContext('2d');
  ctx.clearRect(0, 0, lbC.width, lbC.height);
  ctx.drawImage(srcCanvas, 0, 0, lbC.width, lbC.height);
  lightbox.classList.add('open');
}

function closeLightbox() {
  lightbox.classList.remove('open');
}

document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });


</script>
